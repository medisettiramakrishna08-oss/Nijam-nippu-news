<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telugu News Swipe App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 420px; height: 100%; max-height: 850px; background-color: #1e1e1e; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        header { background-color: #d32f2f; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.3); display: flex; justify-content: space-between; align-items: center; }
        header span { font-size: 12px; background: rgba(0,0,0,0.3); padding: 4px 8px; border-radius: 10px; }
        .news-viewport { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .news-viewport::-webkit-scrollbar { display: none; }
        .news-card { height: 100%; scroll-snap-align: start; display: flex; flex-direction: column; background-color: #1e1e1e; position: relative; padding: 20px; justify-content: flex-start; }
        .news-image { width: 100%; height: 230px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; background-color: #2c2c2c; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .news-content-box { overflow-y: auto; flex: 1; padding-right: 5px; display: flex; flex-direction: column; }
        .news-content-box::-webkit-scrollbar { width: 4px; }
        .news-content-box::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        .news-category { align-self: flex-start; background-color: #d32f2f; color: white; padding: 4px 10px; font-size: 12px; border-radius: 4px; margin-bottom: 12px; font-weight: bold; }
        .news-title { font-size: 20px; font-weight: bold; color: #ffffff; margin-bottom: 15px; line-height: 1.4; }
        .news-description { font-size: 16px; color: #cccccc; line-height: 1.6; text-align: justify; }
        .footer-nav { padding: 10px; text-align: center; background-color: #181818; font-size: 11px; color: #777; border-top: 1px solid #2c2c2c; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            తాజా వార్తలు 
            <span id="updateStatus">Live 🔴</span>
        </header>
        
        <div id="newsContainer" class="news-viewport">
            <!-- వార్తలు ఇక్కడ వస్తాయి -->
        </div>

        <div class="footer-nav">
            పైకి/కిందకి స్వైప్ చేయండి
        </div>
    </div>

    <script>
        // 1. ఇక్కడ మీరు వార్తలను మాన్యువల్ గా సొంతంగా రాసుకోవచ్చు
        const myNewsData = [
            {
                category: "రాజకీయం",
                title: "మీ మొదటి వార్త హెడ్డింగ్ ఇక్కడ రాయండి",
                description: "ఇది మీ వార్త యొక్క పూర్తి వివరాలు. Way2News లాగా ఇక్కడ మీరు ఎంత పెద్ద మేటర్ అయినా రాసుకోవచ్చు. నెట్‌వర్క్ ఎర్రర్స్ రావు, లోడింగ్ ప్రాబ్లమ్ అస్సలు ఉండదు. అంతా మీ చేతుల్లోనే ఉంటుంది.",
                image: "https://images.unsplash.com/photo-1546422904-90eab23c3d7e?auto=format&fit=crop&w=400&q=80"
            },
            {
                category: "సినిమా",
                title: "టాలీవుడ్ లో కొత్త సినిమాల సందడి",
                description: "ఇక్కడ మీరు సినిమా వార్తలు రాసుకోవచ్చు. పైన ఉన్న ఇమేజ్ లింక్ ని మార్చితే, మీకు కావాల్సిన ఫోటో ఇక్కడ డిస్ప్లే అవుతుంది. ఎన్ని వార్తలు కావాలంటే అన్ని కింద యాడ్ చేసుకుంటూ వెళ్లొచ్చు.",
                image: "https://images.unsplash.com/photo-1598899134739-24c46f58b8c0?auto=format&fit=crop&w=400&q=80"
            },
            {
                category: "టెక్నాలజీ",
                title: "సరికొత్త ఫీచర్లతో వచ్చిన మొబైల్",
                description: "ఈ విధంగా మీరు మీకు నచ్చిన కేటగిరీ పెట్టుకుని, మీ సొంత వార్తలను ప్రజలకు అందించవచ్చు. ఇది GitHub లో పెడితే సెకనులో ఫాస్ట్ గా ఓపెన్ అవుతుంది.",
                image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=400&q=80"
            }
        ];

        // 2. మీ వార్తలను యాప్ లో చూపించే ఫంక్షన్
        function loadManualNews() {
            const container = document.getElementById('newsContainer');
            container.innerHTML = ''; 

            myNewsData.forEach((news) => {
                const card = document.createElement('div');
                card.className = 'news-card';
                
                card.innerHTML = `
                    <div class="news-content-box">
                        <img src="${news.image}" class="news-image" alt="Thumbnail">
                        <span class="news-category">${news.category}</span>
                        <h2 class="news-title">${news.title}</h2>
                        <p class="news-description">${news.description}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // యాప్ ఓపెన్ అవ్వగానే మీ వార్తలు ఫాస్ట్ గా లోడ్ అవుతాయి
        window.onload = loadManualNews;
    </script>
</body>
</html>

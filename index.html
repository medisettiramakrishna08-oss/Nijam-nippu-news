<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telugu News Swipe App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 420px; height: 100%; max-height: 850px; background-color: #1e1e1e; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        header { background-color: #d32f2f; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.3); display: flex; justify-content: space-between; align-items: center; }
        header span { font-size: 12px; background: rgba(0,0,0,0.3); padding: 4px 8px; border-radius: 10px; }
        .news-viewport { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .news-viewport::-webkit-scrollbar { display: none; }
        .news-card { height: 100%; scroll-snap-align: start; display: flex; flex-direction: column; background-color: #1e1e1e; position: relative; padding: 20px; justify-content: flex-start; }
        .news-image { width: 100%; height: 230px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; background-color: #2c2c2c; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .news-content-box { overflow-y: auto; flex: 1; padding-right: 5px; display: flex; flex-direction: column; }
        .news-content-box::-webkit-scrollbar { width: 4px; }
        .news-content-box::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        .news-category { align-self: flex-start; background-color: #d32f2f; color: white; padding: 4px 10px; font-size: 12px; border-radius: 4px; margin-bottom: 12px; font-weight: bold; }
        .news-title { font-size: 20px; font-weight: bold; color: #ffffff; margin-bottom: 15px; line-height: 1.4; }
        .news-description { font-size: 16px; color: #cccccc; line-height: 1.6; text-align: justify; }
        .footer-nav { padding: 10px; text-align: center; background-color: #181818; font-size: 11px; color: #777; border-top: 1px solid #2c2c2c; }
        .loading { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; font-size: 15px; color: #888; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            తాజా వార్తలు 
            <span id="updateStatus">Live 🔴</span>
        </header>
        
        <div id="newsContainer" class="news-viewport">
            <div class="loading">లైవ్ వార్తలు లోడ్ అవుతున్నాయి... ⚡</div>
        </div>

        <div class="footer-nav">
            పైకి/కిందకి స్వైప్ చేయండి • ప్రతి 10 నిమిషాలకు ఆటో-అప్‌డేట్
        </div>
    </div>

    <script>
        async function fetchLiveNews() {
            const container = document.getElementById('newsContainer');
            
            try {
                // 100% Free RSS Feed (OneIndia Telugu) + Free AllOrigins Proxy
                const rssUrl = 'https://telugu.oneindia.com/rss/telugu-news-fb.xml';
                const apiQuery = `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`;
                
                const response = await fetch(apiQuery);
                const xmlText = await response.text();
                
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                const items = xmlDoc.querySelectorAll("item");

                if(items.length > 0) {
                    container.innerHTML = ''; 

                    items.forEach((item, index) => {
                        const title = item.querySelector("title") ? item.querySelector("title").textContent : "శీర్షిక లేదు";
                        let description = item.querySelector("description") ? item.querySelector("description").textContent : "";
                        
                        // ఇమేజ్ ఎక్స్‌ట్రాక్షన్
                        let imageUrl = "";
                        const enclosure = item.querySelector("enclosure");
                        if (enclosure) imageUrl = enclosure.getAttribute("url");

                        if (!imageUrl && description.includes("<img")) {
                            const imgMatch = description.match(/src="([^">]+)"/);
                            if (imgMatch) imageUrl = imgMatch[1];
                        }
                        
                        if (!imageUrl) {
                            imageUrl = `https://images.unsplash.com/photo-1546422904-90eab23c3d7e?auto=format&fit=crop&w=400&q=80`;
                        }

                        // Way2News లాగా కేవలం టెక్స్ట్ మాత్రమే ఉండేలా క్లీన్ చేయడం
                        let cleanDesc = description.replace(/<[^>]*>?/gm, '').trim();
                        
                        // చదవడానికి అనువుగా వార్త సారాంశం (500 అక్షరాలు)
                        if(cleanDesc.length > 500) {
                            cleanDesc = cleanDesc.substring(0, 500) + '...';
                        }

                        // కంటెంట్ లేని వార్తలను స్కిప్ చేయడం
                        if(cleanDesc.length < 50) return;

                        const card = document.createElement('div');
                        card.className = 'news-card';
                        
                        // 'పూర్తి వార్త చదవండి' బటన్ తీసేశాను, డైరెక్ట్ వార్త మాత్రమే ఉంటుంది
                        card.innerHTML = `
                            <div class="news-content-box">
                                <img src="${imageUrl}" class="news-image" alt="Thumbnail" onerror="this.src='https://images.unsplash.com/photo-1546422904-90eab23c3d7e?auto=format&fit=crop&w=400&q=80'">
                                <span class="news-category">ముఖ్య వార్త</span>
                                <h2 class="news-title">${title}</h2>
                                <p class="news-description">${cleanDesc}</p>
                            </div>
                        `;
                        container.appendChild(card);
                    });

                    // టైమ్ అప్‌డేట్
                    let now = new Date();
                    let mins = now.getMinutes() < 10 ? '0' + now.getMinutes() : now.getMinutes();
                    document.getElementById('updateStatus').innerText = "Updated: " + now.getHours() + ":" + mins;
                } else {
                    throw new Error("వార్తలు రాలేదు");
                }
            } catch (error) {
                container.innerHTML = '<div class="loading">వార్తలు లోడ్ అవ్వడంలో సమస్య ఉంది. దయచేసి రిఫ్రెష్ చేయండి.</div>';
            }
        }

        // యాప్ ఓపెన్ అవ్వగానే లోడ్ అవుతుంది
        window.onload = () => {
            fetchLiveNews();
            // ప్రతి 10 నిమిషాలకు ఫ్రీగా ఆటోమేటిక్ అప్డేట్ అవుతుంది
            setInterval(fetchLiveNews, 600000); 
        };
    </script>
</body>
</html>

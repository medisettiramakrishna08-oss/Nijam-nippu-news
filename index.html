<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telugu News Swipe App - Live</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 850px;
            background-color: #1e1e1e;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        header {
            background-color: #d32f2f;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header span {
            font-size: 12px;
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
            border-radius: 10px;
        }

        .news-viewport {
            flex: 1;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }

        .news-viewport::-webkit-scrollbar {
            display: none;
        }

        .news-card {
            height: 100%;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
            position: relative;
            padding: 20px;
            justify-content: space-between;
        }

        .news-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
            background-color: #2c2c2c;
        }

        .news-content-box {
            overflow-y: auto;
            flex: 1;
            padding-right: 5px;
        }

        .news-content-box::-webkit-scrollbar {
            width: 4px;
        }

        .news-content-box::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }

        .news-category {
            display: inline-block;
            background-color: #d32f2f;
            color: white;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .news-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .news-description {
            font-size: 14px;
            color: #b0b0b0;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .read-more-btn {
            display: block;
            text-align: center;
            background-color: #d32f2f;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(211, 47, 47, 0.3);
        }

        .footer-nav {
            padding: 8px;
            text-align: center;
            background-color: #181818;
            font-size: 11px;
            color: #777;
            border-top: 1px solid #2c2c2c;
        }

        .loading {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-size: 15px;
            color: #888;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            తాజా వార్తలు 
            <span id="updateStatus">Live 🔴</span>
        </header>
        
        <div id="newsContainer" class="news-viewport">
            <div class="loading">వార్తలు లోడ్ అవుతున్నాయి... <br><br> దయచేసి వేచి ఉండండి.</div>
        </div>

        <div class="footer-nav">
            స్వైప్ అప్ / డౌన్ చేయండి • ప్రతి 10 నిమిషాలకు ఆటో-అప్‌డేట్
        </div>
    </div>

    <script>
        async function fetchLiveNews() {
            const container = document.getElementById('newsContainer');
            
            try {
                // Using reliable proxy and ABP Desam / News18 Telugu feeds
                const rssUrl = 'https://telugu.news18.com/rss/top-news.xml';
                const apiQuery = `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`;
                
                const response = await fetch(apiQuery);
                if (!response.ok) throw new Error('Network request failed');
                
                const strData = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(strData, "text/xml");
                const items = xmlDoc.querySelectorAll("item");

                if (items.length > 0) {
                    container.innerHTML = ''; // Clear loading text

                    items.forEach((item, index) => {
                        const title = item.querySelector("title") ? item.querySelector("title").textContent : "శీర్షిక అందుబాటులో లేదు";
                        let description = item.querySelector("description") ? item.querySelector("description").textContent : "";
                        const link = item.querySelector("link") ? item.querySelector("link").textContent : "#";

                        // Intelligent Image Extraction (Finds exact thumbnail from XML)
                        let imageUrl = "";
                        const enclosure = item.querySelector("enclosure");
                        const mediaContent = item.getElementsByTagName("media:content")[0];
                        
                        if (enclosure && enclosure.getAttribute("url")) {
                            imageUrl = enclosure.getAttribute("url");
                        } else if (mediaContent && mediaContent.getAttribute("url")) {
                            imageUrl = mediaContent.getAttribute("url");
                        } else {
                            // description లోపల ఇమేజ్ ఉంటే లాగడం
                            const imgMatch = description.match(/<img[^>]+src="([^">]+)"/);
                            if (imgMatch && imgMatch[1]) {
                                imageUrl = imgMatch[1];
                            }
                        }

                        // ఏ ఇమేజ్ దొరకకపోతే మాత్రమే డీఫాల్ట్ ఇమేజ్ వేయడం
                        if(!imageUrl) {
                            imageUrl = `https://picsum.photos/400/250?random=${index}`;
                        }

                        // టెక్స్ట్ లోని HTML ట్యాగ్స్ క్లీన్ చేయడం
                        let cleanDesc = description.replace(/<[^>]*>?/gm, '').trim();
                        if(cleanDesc.length > 180) cleanDesc = cleanDesc.substring(0, 180) + '...';

                        const card = document.createElement('div');
                        card.className = 'news-card';
                        card.innerHTML = `
                            <div class="news-content-box">
                                <img src="${imageUrl}" class="news-image" alt="Thumbnail" onerror="this.src='https://picsum.photos/400/250?random=${index}'">
                                <span class="news-category">తాజా వార్త #${index + 1}</span>
                                <h2 class="news-title">${title}</h2>
                                <p class="news-description">${cleanDesc}</p>
                            </div>
                            <a href="${link}" target="_blank" class="read-more-btn">పూర్తి వార్త చదవండి →</a>
                        `;
                        container.appendChild(card);
                    });

                    // Update time tag
                    let now = new Date();
                    let mins = now.getMinutes() < 10 ? '0' + now.getMinutes() : now.getMinutes();
                    document.getElementById('updateStatus').innerText = "Updated: " + now.getHours() + ":" + mins;
                } else {
                    container.innerHTML = '<div class="loading">ప్రస్తుతం వార్తలు దొరకలేదు. కాసేపటి తర్వాత మళ్లీ ట్రై చేయండి.</div>';
                }
            } catch (error) {
                container.innerHTML = '<div class="loading">నెట్‌వర్క్ కనెక్షన్ స్లోగా ఉంది లేదా లోడ్ అవ్వట్లేదు. దయచేసి పేజీ రిఫ్రెష్ చేయండి.</div>';
                console.log(error);
            }
        }

        // App open అవ్వగానే లోడ్ అవుతుంది
        window.onload = () => {
            fetchLiveNews();
            
            // ప్రతి 10 నిమిషాలకు ఆటోమేటిక్ గా అప్డేట్ అవుతుంది (600000 ms)
            setInterval(fetchLiveNews, 600000);
        };
    </script>
</body>
</html>
